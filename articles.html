<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artikel Fotografi — Arta Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ============================
           ARTICLES PAGE STYLES
        ============================ */

        /* Featured Article */
        .featured-article {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 3rem;
            align-items: center;
            margin-bottom: 4rem;
            padding-bottom: 4rem;
            border-bottom: 1px solid var(--border);
        }

        .featured-img {
            border-radius: var(--radius);
            overflow: hidden;
            aspect-ratio: 16/10;
            position: relative;
        }

        .featured-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s ease;
        }

        .featured-img:hover img { transform: scale(1.04); }

        .featured-img .feat-badge {
            position: absolute;
            top: 16px;
            left: 16px;
            padding: 6px 14px;
            background: var(--accent);
            color: #0e0e0e;
            border-radius: 60px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .featured-content .article-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 0.82rem;
            color: var(--fg-muted);
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .featured-content .article-meta .cat {
            color: var(--accent);
            font-weight: 600;
        }

        .featured-content .article-meta .dot-sep {
            width: 4px;
            height: 4px;
            background: var(--fg-muted);
            border-radius: 50%;
        }

        .featured-content h2 {
            font-size: clamp(1.6rem, 3vw, 2.2rem);
            font-weight: 900;
            line-height: 1.25;
            margin-bottom: 1rem;
        }

        .featured-content h2 a {
            color: var(--fg);
            transition: color var(--transition);
        }

        .featured-content h2 a:hover { color: var(--accent); }

        .featured-content p {
            font-size: 0.95rem;
            color: var(--fg-muted);
            line-height: 1.8;
            margin-bottom: 1.5rem;
        }

        .article-author-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .article-author-row img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border);
        }

        .article-author-row .author-info h4 {
            font-family: 'DM Sans', sans-serif;
            font-size: 0.88rem;
            font-weight: 600;
        }

        .article-author-row .author-info span {
            font-size: 0.78rem;
            color: var(--fg-muted);
        }
